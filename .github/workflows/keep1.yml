name: Keep Alive CBRE API

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping API with retry
        run: |
          echo "Starting ping..."
          for i in 1 2 3; do
            echo "Attempt $i"
            curl -f -L https://cbre-api.onrender.com/cbre && break
            sleep 5
          done
